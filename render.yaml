services:
  - type: web
    name: internship-log
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w client
    startCommand: npm run migrate -w server && npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
